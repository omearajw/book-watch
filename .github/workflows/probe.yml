name: Probe sites

on:
  workflow_dispatch:
    inputs:
      query:
        description: Search text
        default: direbound

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe.mjs "$QUERY"
        env:
          QUERY: ${{ inputs.query }}

name: Publish website

# Deploys only when the site itself changes. The listing data is read live from the repo
# by the page, so the checker's frequent commits don't trigger a rebuild.
on:
  push:
    branches: [main]
    paths:
      - docs/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy are separate jobs: deploying in the same job straight after the upload
  # repeatedly failed with "No artifacts named github-pages", because GitHub hadn't registered
  # the upload yet.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

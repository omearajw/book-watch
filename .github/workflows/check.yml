name: Check listings

on:
  schedule:
    # Off the quarter hours: GitHub delays or drops scheduled runs at busy times, worst on the hour.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  # Edits from the website are pushed with her token, which does trigger workflows, so a new
  # watch or a newly added phone is checked straight away. The checker's own commits use
  # GITHUB_TOKEN, which never triggers workflows, so this can't loop.
  push:
    branches: [main]
    paths:
      - data/watches.json
      - data/push-subscriptions.json

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the branch tip, not the commit that triggered the run: a run queued behind
      # another must start from the state that run saved, or the two collide on push.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The photo-matching model is about 350 MB; keep it between runs instead of downloading it every 15 minutes.
      - uses: actions/cache@v6
        with:
          path: .cache/models
          key: models-dinov2-base
      - run: npm ci
        env:
          # The photo model's runtime fetches GPU (CUDA) binaries on Linux by default; these runners have no GPU.
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: node scripts/check.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Save what was seen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/matches.json
          # Wrong-cover examples saved from listings marked "Not this cover".
          if [ -d data/photos/not ]; then git add data/photos/not; fi
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update listings"
          # Only this workflow writes these two files, so if a rebase still clashes on them,
          # this run's newer copy wins (-X theirs is the commit being replayed during a rebase).
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

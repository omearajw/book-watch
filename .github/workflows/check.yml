name: Check listings

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  # Edits from the website are pushed with her token, which does trigger workflows, so a new
  # watch or a newly added phone is checked straight away. The checker's own commits use
  # GITHUB_TOKEN, which never triggers workflows, so this can't loop.
  push:
    branches: [main]
    paths:
      - data/watches.json
      - data/push-subscriptions.json

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      - name: Save what was seen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/matches.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update listings"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
